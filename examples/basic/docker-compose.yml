# Optional MediaMTX relay (NOT required for v0.1 QA).
#
# Purpose: feed RTSP/IP-camera streams to the browser via WHEP (WebRTC) or,
# with a small shim, restream them over the websocket transport that this
# example already speaks. This compose file is documentation-only: the basic
# example streams a bundled FLV fixture over ws://.../live and never talks to
# MediaMTX. It is provided so camera owners have a known-good relay to point
# at once WHEP support lands (out of scope for v0.1).
#
# Usage:
#   docker compose -f examples/basic/docker-compose.yml up -d mediamtx
#
# Then point an RTSP camera at rtsp://localhost:8554/<camera-name>. The stream
# is published as HLS at http://localhost:8888/<stream> (HLS is on by default;
# the HTTP API is not exposed). WebRTC egress runs on port 8889:
#   http://localhost:8889/<stream>/whep   (WHEP)
#   http://localhost:8889/<stream>/whip   (WHIP)
# with ICE/UDP media on 8189/udp.
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP (camera input)
      - "8888:8888" # HLS (http://localhost:8888/<stream>)
      - "8889:8889" # WebRTC / WHEP / WHIP (http://localhost:8889/<stream>/whep)
      - "8189:8189/udp" # ICE / WebRTC media (UDP)
